<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NexusBot app icon">
  <title>NexusBot</title>

  <defs>
    <!-- Full-bleed crimson brand gradient (becomes the whole icon face) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EF4444"/>
      <stop offset="50%"  stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Subtle top sheen for depth -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>

  <!-- Stylized "N" from the logo (240x240 artwork), scaled ~5.2x and centered -->
  <g transform="translate(-112,-112) scale(5.2)" fill="url(#nGradient)">
    <path d="M 79 70 L 96 70 L 96 170 L 79 170 Z"/>
    <path d="M 96 70 L 116 70 L 144 170 L 124 170 Z"/>
    <path d="M 144 70 L 161 70 L 161 170 L 144 170 Z"/>
  </g>
</svg>
