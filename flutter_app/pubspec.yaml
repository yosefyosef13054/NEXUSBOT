name: nexusbot
description: NexusBot — official Flutter client for the NexusBot AI chat backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.6.2

  # --- Networking ---
  dio: ^5.7.0
  flutter_client_sse: ^2.0.2
  web_socket_channel: ^3.0.1

  # --- Persistence ---
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # --- UI ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2
  cupertino_icons: ^1.0.8

  # --- Utils ---
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.4
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0A0A0A"
  ios: true
  android: true
  web:
    generate: true
  macos:
    generate: true
