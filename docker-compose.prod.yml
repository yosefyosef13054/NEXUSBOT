# Production-shaped stack: immutable images, no bind mounts, no auto-reload, multiple
# uvicorn workers. Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud LB) in front of :8000 and
# set ALLOWED_ORIGINS / JWT_SECRET_KEY / APP_ENV=production in .env.
x-app-env: &app-env
  env_file: .env

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-env
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *app-env
    build: .
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
      --forwarded-allow-ips='*' --workers ${UVICORN_WORKERS:-2} --timeout-graceful-shutdown 30
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-env
    build: .
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,ingest

volumes:
  postgres_data:
  uploads:
