<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NexusBot logo">
  <title>NexusBot</title>

  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EF4444"/>
      <stop offset="50%"  stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <linearGradient id="hexHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded flat-top hexagon -->
  <g filter="url(#dropShadow)">
    <path
      d="M 194 109.61
         L 166 61.11
         Q 160 50.72 148 50.72
         L 92 50.72
         Q 80 50.72 74 61.11
         L 46 109.61
         Q 40 120 46 130.39
         L 74 178.89
         Q 80 189.28 92 189.28
         L 148 189.28
         Q 160 189.28 166 178.89
         L 194 130.39
         Q 200 120 194 109.61 Z"
      fill="url(#hexGradient)"/>
    <!-- subtle inner sheen -->
    <path
      d="M 194 109.61
         L 166 61.11
         Q 160 50.72 148 50.72
         L 92 50.72
         Q 80 50.72 74 61.11
         L 46 109.61
         Q 40 120 46 130.39
         L 74 178.89
         Q 80 189.28 92 189.28
         L 148 189.28
         Q 160 189.28 166 178.89
         L 194 130.39
         Q 200 120 194 109.61 Z"
      fill="url(#hexHighlight)"/>
    <!-- thin inner border -->
    <path
      d="M 194 109.61
         L 166 61.11
         Q 160 50.72 148 50.72
         L 92 50.72
         Q 80 50.72 74 61.11
         L 46 109.61
         Q 40 120 46 130.39
         L 74 178.89
         Q 80 189.28 92 189.28
         L 148 189.28
         Q 160 189.28 166 178.89
         L 194 130.39
         Q 200 120 194 109.61 Z"
      fill="none" stroke="#FCA5A5" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Stylized "N" — three angled bars forming the letter -->
  <g fill="url(#nGradient)">
    <!-- left vertical bar (slightly angled top) -->
    <path d="M 79 70 L 96 70 L 96 170 L 79 170 Z"/>
    <!-- diagonal -->
    <path d="M 96 70 L 116 70 L 144 170 L 124 170 Z"/>
    <!-- right vertical bar -->
    <path d="M 144 70 L 161 70 L 161 170 L 144 170 Z"/>
  </g>
</svg>
